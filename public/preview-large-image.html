<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview UI/UX - 5-Card Symmetrical Spacing Showcase Slider</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

    <style>
        /* ═══════════════════════════════════════════════════════════════
           PREMIUM EDITORIAL DESIGN SYSTEM
           ═══════════════════════════════════════════════════════════════ */
        :root {
            --bg-page: #f8fafc;
            --bg-surface: #ffffff;
            --bg-surface-alt: #f1f5f9;
            --ink: #0f172a;
            --ink-muted: #475569;
            --ink-faint: #94a3b8;
            --border: #e2e8f0;
            --border-subtle: rgba(226, 232, 240, 0.8);
            
            --primary: #0284c7;
            --primary-glow: rgba(2, 132, 199, 0.45);
            --primary-light: rgba(2, 132, 199, 0.08);

            --radius-card: 20px;
        }

        [data-theme="dark"] {
            --bg-page: #060b13;
            --bg-surface: #0c1524;
            --bg-surface-alt: #111e33;
            --ink: #f8fafc;
            --ink-muted: #94a3b8;
            --ink-faint: #64748b;
            --border: #1e293b;
            --border-subtle: rgba(255, 255, 255, 0.08);

            --primary: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.55);
            --primary-light: rgba(56, 189, 248, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-page);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.35s ease, color 0.35s ease;
            overflow-x: hidden;
        }

        /* ═══ TOP TOOLBAR ═══ */
        .preview-topbar {
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            padding: 14px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
        }

        .preview-branding {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-badge {
            background: var(--primary-light);
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            border: 1px solid var(--primary-glow);
        }

        .preview-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--ink);
        }

        .preview-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-tool {
            background: var(--bg-surface-alt);
            border: 1px solid var(--border);
            color: var(--ink-muted);
            padding: 7px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-tool:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-light);
        }

        /* ═══════════════════════════════════════════════════════════════
           MAIN SECTION: 5-CARD SHOWCASE (WITH INSET BLUE GLOW)
           ═══════════════════════════════════════════════════════════════ */
        .showcase-section {
            padding: 30px 0 50px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .showcase-container {
            width: 100%;
            max-width: 100%;
            margin: 0;
            padding: 0;
            position: relative;
        }

        /* Outer Viewport - Dilengkapi Glowing Inset Shadow Biru Menyala */
        .carousel-outer-wrap {
            position: relative;
            width: 100%;
            overflow: hidden;
            padding: 20px 0;
            border-top: 1px solid rgba(2, 132, 199, 0.22);
            border-bottom: 1px solid rgba(2, 132, 199, 0.22);
            box-shadow: inset 0 0 35px -5px rgba(2, 132, 199, 0.4), inset 0 0 70px -10px rgba(2, 132, 199, 0.2);
            transition: box-shadow 0.35s ease, border-color 0.35s ease;
        }

        [data-theme="dark"] .carousel-outer-wrap {
            border-top-color: rgba(56, 189, 248, 0.35);
            border-bottom-color: rgba(56, 189, 248, 0.35);
            box-shadow: inset 0 0 45px -5px rgba(56, 189, 248, 0.55), inset 0 0 90px -10px rgba(14, 165, 233, 0.25);
        }

        /* Inset Glow Overlay Mengelilingi 4 Sisi Slider */
        .carousel-outer-wrap::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 10;
            box-shadow: inset 0 0 35px rgba(2, 132, 199, 0.45), inset 0 0 70px rgba(2, 132, 199, 0.2);
            transition: box-shadow 0.35s ease;
        }

        [data-theme="dark"] .carousel-outer-wrap::before {
            box-shadow: inset 0 0 45px rgba(56, 189, 248, 0.55), inset 0 0 90px rgba(14, 165, 233, 0.3);
        }

        /* Step Slider Track: Jarak simetris 18px */
        .carousel-step-track {
            display: flex;
            gap: 18px;
            width: max-content;
            will-change: transform;
            cursor: grab;
            user-select: none;
            padding: 6px 18px;
            transition: transform 0.65s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .carousel-step-track:active {
            cursor: grabbing;
        }

        /* ═══ CARD: MURNI GAMBAR LANGSUNG ═══ */
        .gallery-card-frame {
            /* Dihitung dinamis via CSS variable --card-item-width oleh JS */
            flex: 0 0 var(--card-item-width, 240px);
            width: var(--card-item-width, 240px);
            aspect-ratio: 16 / 10;
            background: transparent;
            padding: 0;
            border: 2px solid transparent;
            border-radius: var(--radius-card);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s ease;
            position: relative;
            cursor: pointer;
            display: flex;
            align-items: stretch;
            justify-content: stretch;
        }

        .gallery-card-frame:hover {
            transform: translateY(-8px);
            border-color: var(--primary);
            box-shadow: 0 16px 36px -6px rgba(0, 0, 0, 0.28), 0 0 20px var(--primary-glow);
            z-index: 20;
        }

        /* Gambar Internal */
        .gallery-img-inner {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: calc(var(--radius-card) - 2px);
            display: block;
            pointer-events: none;
            transition: transform 0.4s ease;
        }

        .gallery-card-frame:hover .gallery-img-inner {
            transform: scale(1.04);
        }

        /* ═══════════════════════════════════════════════════════════════
           LIGHTBOX PREVIEW MODAL (PURE IMAGE + SIDE ARROWS)
           ═══════════════════════════════════════════════════════════════ */
        .lightbox-modal {
            position: fixed;
            inset: 0;
            background: rgba(3, 7, 18, 0.94);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 20px;
        }

        .lightbox-modal.open {
            opacity: 1;
            pointer-events: auto;
        }

        .lightbox-content {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            max-width: 90vw;
            max-height: 90vh;
            background: transparent;
            border: none;
            padding: 0;
            border-radius: 0;
            box-shadow: none;
            animation: zoomModal 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes zoomModal {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .lightbox-img {
            max-width: 82vw;
            max-height: 85vh;
            display: block;
            object-fit: contain;
            border-radius: 0;
            border: none;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
            user-select: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .lightbox-close {
            position: fixed;
            top: 24px;
            right: 28px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            backdrop-filter: blur(8px);
            transition: all 0.2s ease;
            z-index: 1010;
        }

        .lightbox-close:hover {
            background: #ef4444;
            border-color: #ef4444;
            transform: scale(1.1) rotate(90deg);
            color: #ffffff;
        }

        .lightbox-nav-arrow {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1010;
        }

        .lightbox-arrow-prev { left: 32px; }
        .lightbox-arrow-next { right: 32px; }

        @media (max-width: 768px) {
            .lightbox-nav-arrow {
                width: 42px;
                height: 42px;
                font-size: 16px;
            }
            .lightbox-arrow-prev { left: 12px; }
            .lightbox-arrow-next { right: 12px; }
            .lightbox-close { top: 16px; right: 16px; }
        }

        .lightbox-nav-arrow:hover {
            background: var(--primary);
            border-color: var(--primary);
            color: #ffffff;
            transform: translateY(-50%) scale(1.12);
            box-shadow: 0 0 25px var(--primary-glow);
        }

        /* ═══ HUMAS DEMO UPLOAD INFO ═══ */
        .humas-demo-card {
            max-width: calc(100% - 36px);
            margin: 20px auto 30px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
        }

        .upload-dropzone {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 22px;
            text-align: center;
            background: var(--bg-surface-alt);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .upload-dropzone:hover {
            border-color: var(--primary);
            background: var(--primary-light);
        }
    </style>
</head>

    <!-- ═══ STEP-BY-STEP SLIDER SCRIPT (+1 PER STEP) ═══ -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const viewport = document.getElementById('stepViewport');
            const track = document.getElementById('stepTrack');
            
            // Lightbox Elements
            const lightbox = document.getElementById('lightboxModal');
            const lightboxImg = document.getElementById('lightboxImg');
            const lightboxClose = document.getElementById('lightboxClose');
            const lightboxPrev = document.getElementById('lightboxPrev');
            const lightboxNext = document.getElementById('lightboxNext');

            // Topbar Controls
            const btnTheme = document.getElementById('btnThemeToggle');
            const iconTheme = document.getElementById('iconTheme');
            const labelTheme = document.getElementById('labelTheme');
            const btnAnim = document.getElementById('btnToggleAnimation');
            const iconAnim = document.getElementById('iconAnim');
            const textAnim = document.getElementById('textAnim');

            // 1. GATHER UNIQUE IMAGE LIST FOR LIGHTBOX
            const originalCards = Array.from(track.children);
            const originalCount = originalCards.length;
            const imageList = originalCards.map(card => {
                const img = card.querySelector('img');
                return img ? img.src : '';
            });

            // 2. CLONE ITEMS TO ENABLE SEAMLESS INFINITE STEP SLIDING
            originalCards.forEach(card => {
                const clone = card.cloneNode(true);
                track.appendChild(clone);
            });

            const GAP = 18; // 18px jarak celah antar kartu & margin tepi
            const STEP_DURATION = 3500; // 3.5 Detik per pergeseran 1 gambar
            let currentIndex = 0;
            let stepInterval = null;
            let isHovered = false;
            let isPausedManually = false;

            // 3. KALKULASI UKURAN KARTU SIMETRIS
            function calculateCardWidth() {
                const containerWidth = viewport.clientWidth || window.innerWidth;
                let visibleCount = 5;
                if (window.innerWidth <= 640) visibleCount = 2;
                else if (window.innerWidth <= 1024) visibleCount = 3;
                else visibleCount = 5;

                const totalSpacing = (visibleCount + 1) * GAP;
                const cardWidth = (containerWidth - totalSpacing) / visibleCount;
                
                document.documentElement.style.setProperty('--card-item-width', `${cardWidth}px`);
                return cardWidth + GAP;
            }

            let stepWidth = calculateCardWidth();
            window.addEventListener('resize', () => {
                stepWidth = calculateCardWidth();
                track.style.transition = 'none';
                track.style.transform = `translate3d(${-currentIndex * stepWidth}px, 0, 0)`;
            });

            // 4. STEP-BY-STEP SLIDE ENGINE
            function slideNext() {
                currentIndex++;
                track.style.transition = 'transform 0.65s cubic-bezier(0.25, 1, 0.5, 1)';
                track.style.transform = `translate3d(${-currentIndex * stepWidth}px, 0, 0)`;

                // Ketika sudah bergeser sejauh total kartu asli, reset ke index 0 secara invisible
                if (currentIndex >= originalCount) {
                    setTimeout(() => {
                        track.style.transition = 'none';
                        currentIndex = 0;
                        track.style.transform = `translate3d(0px, 0, 0)`;
                    }, 650);
                }
            }

            function startStepTimer() {
                clearInterval(stepInterval);
                if (isPausedManually) return;
                stepInterval = setInterval(() => {
                    if (!isHovered && !isPausedManually) {
                        slideNext();
                    }
                }, STEP_DURATION);
            }

            startStepTimer();

            // Hover Pause
            viewport.addEventListener('mouseenter', () => { isHovered = true; });
            viewport.addEventListener('mouseleave', () => { isHovered = false; });

            // 5. LIGHTBOX LOGIC
            let currentLightboxIndex = 0;

            function showLightboxImage(index) {
                if (index < 0) index = imageList.length - 1;
                if (index >= imageList.length) index = 0;
                currentLightboxIndex = index;

                lightboxImg.style.opacity = '0.3';
                lightboxImg.style.transform = 'scale(0.98)';
                
                setTimeout(() => {
                    lightboxImg.src = imageList[currentLightboxIndex];
                    lightboxImg.style.opacity = '1';
                    lightboxImg.style.transform = 'scale(1)';
                }, 100);
            }

            // Click Card to Open Lightbox
            track.addEventListener('click', (e) => {
                const card = e.target.closest('.gallery-card-frame');
                if (!card) return;
                const img = card.querySelector('img');
                if (img) {
                    const foundIndex = imageList.indexOf(img.src);
                    showLightboxImage(foundIndex !== -1 ? foundIndex : 0);
                    lightbox.classList.add('open');
                }
            });

            // Lightbox Prev & Next
            lightboxPrev.addEventListener('click', (e) => {
                e.stopPropagation();
                showLightboxImage(currentLightboxIndex - 1);
            });

            lightboxNext.addEventListener('click', (e) => {
                e.stopPropagation();
                showLightboxImage(currentLightboxIndex + 1);
            });

            function closeLightbox() {
                lightbox.classList.remove('open');
            }

            lightboxClose.addEventListener('click', closeLightbox);
            lightbox.addEventListener('click', (e) => {
                if (e.target === lightbox) {
                    closeLightbox();
                }
            });

            // Keyboard Navigation (Arrow Keys & Escape)
            document.addEventListener('keydown', (e) => {
                if (!lightbox.classList.contains('open')) return;

                if (e.key === 'ArrowLeft') {
                    showLightboxImage(currentLightboxIndex - 1);
                } else if (e.key === 'ArrowRight') {
                    showLightboxImage(currentLightboxIndex + 1);
                } else if (e.key === 'Escape') {
                    closeLightbox();
                }
            });

            // 6. TOGGLE PLAY / PAUSE DARI TOOLBAR
            btnAnim.addEventListener('click', () => {
                isPausedManually = !isPausedManually;
                if (isPausedManually) {
                    clearInterval(stepInterval);
                    iconAnim.className = 'fa-solid fa-play';
                    textAnim.textContent = 'Lanjutkan Animasi';
                } else {
                    startStepTimer();
                    iconAnim.className = 'fa-solid fa-pause';
                    textAnim.textContent = 'Jeda Animasi';
                }
            });

            // 7. THEME SWITCHER (LIGHT / DARK)
            btnTheme.addEventListener('click', () => {
                const current = document.documentElement.getAttribute('data-theme') || 'light';
                const next = current === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);

                if (next === 'dark') {
                    iconTheme.className = 'fa-solid fa-sun';
                    labelTheme.textContent = 'Mode Terang';
                } else {
                    iconTheme.className = 'fa-solid fa-moon';
                    labelTheme.textContent = 'Mode Gelap';
                }
            });
        });
    </script>
</body>
