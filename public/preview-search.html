<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview Komponen Search Premium - Light & Dark Mode</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

    <!-- Component CSS -->
    <link rel="stylesheet" href="css/component/search.css">

    <style>
        :root {
            --bg: #f0f2f8;
            --surface: #ffffff;
            --surface2: #f7f8fc;
            --border: #e4e7f0;
            --text: #1a1d2e;
            --text-sub: #6b7280;
            --accent: #4f46e5;
            --accent2: #7c3aed;
            --radius: 20px;
            --shadow: 0 16px 48px rgba(79, 70, 229, 0.07);
        }

        [data-theme="dark"] {
            --bg: #0b0d13;
            --surface: #141722;
            --surface2: #1b202e;
            --border: #262c3f;
            --text: #e8eaf6;
            --text-sub: #8b92a8;
            --accent: #6366f1;
            --accent2: #8b5cf6;
            --shadow: 0 20px 52px rgba(0, 0, 0, 0.55);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .preview-card {
            width: 100%;
            max-width: 520px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 44px 34px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 26px;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .preview-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .preview-icon-badge {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-bottom: 4px;
            box-shadow: 0 8px 22px rgba(79, 70, 229, 0.32);
        }

        .preview-title {
            font-size: 23px;
            font-weight: 800;
            letter-spacing: -0.025em;
            color: var(--text);
        }

        .preview-subtitle {
            font-size: 14px;
            color: var(--text-sub);
            max-width: 420px;
            line-height: 1.55;
        }

        /* Search Showcase Container */
        .search-showcase {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 22px 0 10px 0;
        }

        .search-status {
            font-size: 13.5px;
            color: var(--text-sub);
            min-height: 22px;
            transition: color 0.2s ease;
        }

        .search-status span {
            font-weight: 600;
            color: var(--accent);
        }

        /* Theme Toggle Button */
        .theme-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: var(--surface2);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 12px;
            font-family: inherit;
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.22s ease;
        }

        .theme-btn:hover {
            background: var(--border);
            border-color: var(--text-sub);
            transform: translateY(-1px);
        }

        .theme-btn:active {
            transform: translateY(0);
        }

        .hint-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-sub);
            background: var(--surface2);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }

        .hint-badge kbd {
            padding: 2px 6px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px;
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            font-weight: 600;
            color: var(--text);
        }
    </style>
</head>
<body>

    <main class="preview-card">
        <header class="preview-header">
            <div class="preview-icon-badge">
                <i class="fas fa-search"></i>
            </div>
            <h1 class="preview-title">Search Component (Premium Edition)</h1>
            <p class="preview-subtitle">
                Arahkan kursor mouse (hover) ke ikon pencarian untuk melihat transisi sinematik yang mulus dan elegan.
            </p>
        </header>

        <!-- Animated Expandable Search Component (Luxury Breathing & Cinematic Hover) -->
        <div class="search-showcase">
            <div 
                class="custom-search-wrapper custom-search-md custom-search-expandable" 
                data-custom-search 
                data-search-expandable="true"
                data-search-id="demoAnimatedSearch"
                data-search-shortcut="Ctrl+K"
            >
                <div class="custom-search-inner">
                    <button 
                        type="button" 
                        class="custom-search-icon custom-search-toggle-btn" 
                        title="Arahkan kursor atau tekan Ctrl+K"
                        aria-label="Buka pencarian"
                    >
                        <i class="fas fa-search"></i>
                    </button>

                    <input 
                        type="text" 
                        id="demoAnimatedSearch" 
                        class="custom-search-input" 
                        placeholder="Cari data pengguna, dokumen..." 
                        autocomplete="off" 
                    />

                    <span class="custom-search-spinner">
                        <i class="fas fa-circle-notch fa-spin"></i>
                    </span>

                    <button 
                        type="button" 
                        class="custom-search-clear" 
                        style="display: none;" 
                        title="Hapus pencarian (Esc)"
                    >
                        <i class="fas fa-times"></i>
                    </button>

                    <kbd class="custom-search-shortcut">Ctrl+K</kbd>
                </div>
            </div>

            <div class="search-status" id="searchStatus">
                Status: <strong>Luxury Breathing Aura</strong> — Arahkan kursor ke ikon untuk meluas.
            </div>

            <div class="hint-badge">
                <i class="fas fa-sparkles" style="color: #f59e0b;"></i>
                <span>Arahkan kursor (hover) atau tekan <kbd>Ctrl+K</kbd> / <kbd>/</kbd></span>
            </div>
        </div>

        <!-- Theme Toggle Button -->
        <button class="theme-btn" id="themeToggleBtn" onclick="toggleTheme()">
            <i class="fas fa-moon" id="themeIcon"></i>
            <span id="themeText">Beralih ke Dark Mode</span>
        </button>
    </main>

    <!-- Component JS -->
    <script src="js/component/search.js"></script>

    <script>
        const searchInput = document.getElementById('demoAnimatedSearch');
        const searchStatus = document.getElementById('searchStatus');
        const searchWrapper = document.querySelector('[data-custom-search]');

        if (searchWrapper && searchStatus) {
            searchWrapper.addEventListener('search:expand', () => {
                searchStatus.innerHTML = `Status: <span>Terbuka (Cinematic Smooth)</span> — Siap mengetik.`;
            });

            searchWrapper.addEventListener('search:collapse', () => {
                searchStatus.innerHTML = `Status: <strong>Luxury Breathing Aura</strong> — Arahkan kursor ke ikon untuk meluas.`;
            });

            searchWrapper.addEventListener('search:input', (e) => {
                const query = e.detail?.query?.trim();
                if (query) {
                    searchStatus.innerHTML = `Mencari: <span>"${query}"</span>`;
                } else {
                    searchStatus.innerHTML = `Status: <span>Terbuka</span> — Masukkan kata kunci.`;
                }
            });

            searchWrapper.addEventListener('search:clear', () => {
                searchStatus.innerHTML = `Pencarian dibersihkan.`;
            });
        }

        // Theme Toggle Functionality
        function toggleTheme() {
            const html = document.documentElement;
            const themeIcon = document.getElementById('themeIcon');
            const themeText = document.getElementById('themeText');
            
            const isDark = html.getAttribute('data-theme') === 'dark';
            const newTheme = isDark ? 'light' : 'dark';

            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);

            if (newTheme === 'dark') {
                themeIcon.className = 'fas fa-sun';
                themeText.textContent = 'Beralih ke Light Mode';
            } else {
                themeIcon.className = 'fas fa-moon';
                themeText.textContent = 'Beralih ke Dark Mode';
            }
        }

        // Initialize Theme from localStorage
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                const themeIcon = document.getElementById('themeIcon');
                const themeText = document.getElementById('themeText');
                if (themeIcon) themeIcon.className = 'fas fa-sun';
                if (themeText) themeText.textContent = 'Beralih ke Light Mode';
            }
        })();
    </script>
</body>
</html>
